<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Multi-Agent RAG Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">Autonomous Multi-Agent RAG Engine</h1>
                <p class="text-xs text-slate-400">LangGraph • Qdrant • Groq • FastAPI</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <a href="/docs" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-200">
                <i class="fa-solid fa-book mr-1"></i> API Docs
            </a>
        </div>
    </header>
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pb-4">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-blue-400"><i class="fa-solid fa-shield-halved mr-2"></i>Self-Correcting Multi-Agent Engine Live</h2>
                <p class="text-xs text-slate-300 mt-2">Ask any technical question against the Qdrant knowledge base:</p>
                <div class="mt-3 flex flex-wrap gap-2">
                    <button onclick="usePrompt('How does LangGraph manage state?')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">How does LangGraph manage state?</button>
                    <button onclick="usePrompt('How does an autonomous agent prevent LLM hallucinations?')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">How does it prevent hallucinations?</button>
                </div>
            </div>
        </div>
        <div class="mt-4 sticky bottom-4 bg-slate-800 border border-slate-700 rounded-xl p-2">
            <form id="query-form" onsubmit="ask(event)" class="flex items-center space-x-2">
                <input id="query-input" type="text" placeholder="Type your question here..." class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none text-slate-100" required>
                <button type="submit" id="btn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium">Ask</button>
            </form>
        </div>
    </main>
    <script>
        function usePrompt(t) { 
            document.getElementById('query-input').value = t; 
            document.getElementById('query-form').dispatchEvent(new Event('submit')); 
        }
        async function ask(e) {
            e.preventDefault();
            const input = document.getElementById('query-input');
            const q = input.value.trim();
            if (!q) return;
            const chat = document.getElementById('chat-box');
            chat.innerHTML += '<div class="flex justify-end"><div class="bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-xl shadow">' + q + '</div></div>';
            input.value = '';
            const loadId = 'load-' + Date.now();
            chat.innerHTML += '<div id="' + loadId + '" class="flex items-center space-x-2 text-slate-400 text-xs py-2"><i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i><span>Agents routing, retrieving & verifying...</span></div>';
            chat.scrollTop = chat.scrollHeight;
            try {
                const res = await fetch('/api/v1/query', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({query: q}) 
                });
                const d = await res.json();
                document.getElementById(loadId).remove();
                const trace = d.execution_trace.map(t => '<li class="py-0.5">• ' + t + '</li>').join('');
                chat.innerHTML += '<div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl rounded-tl-none text-sm space-y-3"><div class="leading-relaxed">' + d.answer + '</div><div class="flex flex-wrap gap-2 text-xs border-t border-slate-700 pt-2"><span class="bg-slate-700 px-2 py-0.5 rounded text-slate-300">⏱️ ' + d.latency_seconds + 's</span><span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-400">🛡️ Grounded: ' + d.is_grounded + '</span><span class="bg-slate-700 px-2 py-0.5 rounded text-blue-400">🔀 ' + d.route + '</span></div><details class="text-xs bg-slate-900/60 p-2 rounded cursor-pointer"><summary class="text-slate-400 font-medium">Agent Execution Trace (' + d.execution_trace.length + ' steps)</summary><ul class="mt-1.5 pl-2 text-slate-400">' + trace + '</ul></details></div>';
            } catch(err) {
                document.getElementById(loadId).remove();
                chat.innerHTML += '<div class="text-red-400 text-xs">Error: ' + err + '</div>';
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
