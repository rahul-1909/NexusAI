<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI — Autonomous Intelligence Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-weight: 700;
            color: #f8fafc;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.15rem;
            color: #60a5fa;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.25rem;
        }

        .markdown-content h3 {
            font-size: 1rem;
            color: #93c5fd;
        }

        .markdown-content p {
            margin-bottom: 0.85rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.25rem;
            margin-bottom: 0.85rem;
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content li {
            margin-bottom: 0.4rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .markdown-content strong {
            color: #ffffff;
            font-weight: 600;
        }

        .markdown-content code {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.85em;
            border: 1px solid #1e293b;
        }

        .markdown-content pre {
            background-color: #0a0f1d;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #1e293b;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <!-- Navbar -->
    <header
        class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 px-6 py-3.5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="newChat()">
            <div
                class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/25">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    NexusAI
                    <span
                        class="text-[10px] uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded-full font-semibold">Copilot</span>
                </h1>
                <p class="text-xs text-slate-400">Autonomous Multi-Agent Intelligence</p>
            </div>
        </div>
        <div class="flex items-center space-x-2.5">
            <button onclick="newChat()"
                class="text-xs bg-slate-700/80 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-plus text-slate-400"></i> New Chat
            </button>
            <a href="/docs" target="_blank"
                class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition flex items-center gap-1.5">
                <i class="fa-solid fa-code text-slate-400"></i> API Docs
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between">
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pb-4">
            <!-- Sleek ChatGPT-style Welcome Hero -->
            <div id="welcome-hero" class="flex flex-col items-center justify-center py-20 text-center space-y-4">
                <div
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-3xl shadow-xl shadow-blue-500/25">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-white">What can I help you with today?</h2>
                <p class="text-sm text-slate-400 max-w-md leading-relaxed">
                    Ask me anything across software engineering, architecture, conceptual reasoning, analysis, or
                    general conversation.
                </p>
            </div>
        </div>

        <!-- Sticky Chat Input Bar -->
        <div
            class="mt-4 sticky bottom-4 bg-slate-800 border border-slate-700 rounded-2xl p-2 shadow-xl shadow-black/20">
            <form id="query-form" onsubmit="ask(event)" class="flex items-center space-x-2">
                <input id="query-input" type="text" placeholder="Ask NexusAI anything..."
                    class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none text-slate-100 placeholder-slate-400"
                    required autofocus>
                <button type="submit" id="btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-md shadow-blue-600/30 flex items-center gap-1.5">
                    <span>Send</span>
                    <i class="fa-solid fa-arrow-up text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }

        function newChat() {
            const chat = document.getElementById('chat-box');
            chat.innerHTML = `
                <div id="welcome-hero" class="flex flex-col items-center justify-center py-20 text-center space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-3xl shadow-xl shadow-blue-500/25">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-tight text-white">What can I help you with today?</h2>
                    <p class="text-sm text-slate-400 max-w-md leading-relaxed">
                        Ask me anything across software engineering, architecture, conceptual reasoning, analysis, or general conversation.
                    </p>
                </div>
            `;
            const input = document.getElementById('query-input');
            input.value = '';
            input.focus();
        }

        async function ask(e) {
            e.preventDefault();
            const input = document.getElementById('query-input');
            const q = input.value.trim();
            if (!q) return;

            // Remove welcome hero on first message
            const hero = document.getElementById('welcome-hero');
            if (hero) hero.remove();

            const chat = document.getElementById('chat-box');
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-xl shadow-md">
                        ${q}
                    </div>
                </div>`;
            input.value = '';

            const loadId = 'load-' + Date.now();
            chat.innerHTML += `
                <div id="${loadId}" class="flex items-center space-x-2 text-slate-400 text-xs py-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i>
                    <span>NexusAI is thinking & synthesizing...</span>
                </div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/v1/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q })
                });
                const d = await res.json();
                document.getElementById(loadId).remove();

                const parsedAnswer = (typeof marked !== 'undefined') ? marked.parse(d.answer) : d.answer.replace(/\n/g, '<br/>');
                const trace = d.execution_trace.map(t => '<li class="py-0.5">• ' + t + '</li>').join('');

                chat.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl rounded-tl-none text-sm space-y-4 shadow-md">
                        <div class="markdown-content">${parsedAnswer}</div>
                        <div class="flex flex-wrap gap-2 text-xs border-t border-slate-700/80 pt-3">
                            <span class="bg-slate-700/80 px-2 py-0.5 rounded text-slate-300">⏱️ ${d.latency_seconds}s</span>
                            <span class="bg-slate-700/80 px-2 py-0.5 rounded text-emerald-400">🛡️ Grounded: ${d.is_grounded}</span>
                            <span class="bg-slate-700/80 px-2 py-0.5 rounded text-blue-400">🔀 ${d.route}</span>
                        </div>
                        <details class="text-xs bg-slate-900/60 p-2.5 rounded-lg cursor-pointer">
                            <summary class="text-slate-400 font-medium hover:text-slate-300">Agent Execution Trace (${d.execution_trace.length} steps)</summary>
                            <ul class="mt-2 pl-2 text-slate-400 space-y-0.5">${trace}</ul>
                        </details>
                    </div>`;
            } catch (err) {
                document.getElementById(loadId).remove();
                chat.innerHTML += '<div class="text-red-400 text-xs">Error: ' + err + '</div>';
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>

</html>
