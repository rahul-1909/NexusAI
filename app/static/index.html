<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Multi-Agent RAG Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-weight: 700;
            color: #f8fafc;
            margin-top: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 1.15rem;
            color: #60a5fa;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.25rem;
        }

        .markdown-content h3 {
            font-size: 1rem;
            color: #93c5fd;
        }

        .markdown-content p {
            margin-bottom: 0.85rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.25rem;
            margin-bottom: 0.85rem;
            space-y: 0.35rem;
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content li {
            margin-bottom: 0.4rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .markdown-content strong {
            color: #ffffff;
            font-weight: 600;
        }

        .markdown-content code {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.85em;
            border: 1px solid #1e293b;
        }

        .markdown-content pre {
            background-color: #0a0f1d;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid #1e293b;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header
        class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div
                class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">Autonomous Multi-Agent RAG Engine</h1>
                <p class="text-xs text-slate-400">LangGraph • Qdrant • Groq • FastAPI</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <a href="/docs" target="_blank"
                class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-200">
                <i class="fa-solid fa-book mr-1"></i> API Docs
            </a>
        </div>
    </header>
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pb-4">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-blue-400"><i
                        class="fa-solid fa-shield-halved mr-2"></i>Self-Correcting Multi-Agent Engine Live</h2>
                <p class="text-xs text-slate-300 mt-2">Ask any technical question against the Qdrant knowledge base:</p>
                <div class="mt-3 flex flex-wrap gap-2">
                    <button onclick="usePrompt('How does LangGraph manage state?')"
                        class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">How does
                        LangGraph manage state?</button>
                    <button onclick="usePrompt('How does an autonomous agent prevent LLM hallucinations?')"
                        class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">How does
                        it prevent hallucinations?</button>
                </div>
            </div>
        </div>
        <div class="mt-4 sticky bottom-4 bg-slate-800 border border-slate-700 rounded-xl p-2">
            <form id="query-form" onsubmit="ask(event)" class="flex items-center space-x-2">
                <input id="query-input" type="text" placeholder="Type your question here..."
                    class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none text-slate-100" required>
                <button type="submit" id="btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium">Ask</button>
            </form>
        </div>
    </main>
    <script>
        // Configure marked to preserve every line break
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }

        function usePrompt(t) {
            document.getElementById('query-input').value = t;
            document.getElementById('query-form').dispatchEvent(new Event('submit'));
        }

        async function ask(e) {
            e.preventDefault();
            const input = document.getElementById('query-input');
            const q = input.value.trim();
            if (!q) return;
            const chat = document.getElementById('chat-box');
            chat.innerHTML += '<div class="flex justify-end"><div class="bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-xl shadow">' + q + '</div></div>';
            input.value = '';
            const loadId = 'load-' + Date.now();
            chat.innerHTML += '<div id="' + loadId + '" class="flex items-center space-x-2 text-slate-400 text-xs py-2"><i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i><span>Agents routing, retrieving & verifying...</span></div>';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/v1/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q })
                });
                const d = await res.json();
                document.getElementById(loadId).remove();

                // Parse clean markdown into formatted HTML
                const parsedAnswer = (typeof marked !== 'undefined') ? marked.parse(d.answer) : d.answer.replace(/\n/g, '<br/>');
                const trace = d.execution_trace.map(t => '<li class="py-0.5">• ' + t + '</li>').join('');

                chat.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl rounded-tl-none text-sm space-y-4 shadow-md">
                        <div class="markdown-content">${parsedAnswer}</div>
                        <div class="flex flex-wrap gap-2 text-xs border-t border-slate-700 pt-3">
                            <span class="bg-slate-700 px-2 py-0.5 rounded text-slate-300">⏱️ ${d.latency_seconds}s</span>
                            <span class="bg-slate-700 px-2 py-0.5 rounded text-emerald-400">🛡️ Grounded: ${d.is_grounded}</span>
                            <span class="bg-slate-700 px-2 py-0.5 rounded text-blue-400">🔀 ${d.route}</span>
                        </div>
                        <details class="text-xs bg-slate-900/60 p-2.5 rounded-lg cursor-pointer">
                            <summary class="text-slate-400 font-medium hover:text-slate-300">Agent Execution Trace (${d.execution_trace.length} steps)</summary>
                            <ul class="mt-2 pl-2 text-slate-400 space-y-0.5">${trace}</ul>
                        </details>
                    </div>`;
            } catch (err) {
                document.getElementById(loadId).remove();
                chat.innerHTML += '<div class="text-red-400 text-xs">Error: ' + err + '</div>';
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>

</html>
